[package]
name = "tsn"
version = "0.1.0"
edition = "2021"
description = "TypeScript to native executable compiler"
license = "MIT"
authors = ["michael"]
repository = "https://github.com/itszzl-sudo/ts-native"
readme = "README.md"
keywords = ["compiler", "typescript", "native", "cranelift"]
categories = ["compilers"]

[[bin]]
name = "tsn"
path = "src/main.rs"

[dependencies]
cranelift = "0.111"
cranelift-module = "0.111"
cranelift-object = "0.111"
cranelift-codegen = "0.111"
cranelift-native = "0.111"
target-lexicon = "0.12"
anyhow = "1.0"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
